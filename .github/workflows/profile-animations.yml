name: Update Profile Animations

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: false

jobs:
  generate-profile-animations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save current animations as fallbacks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin output
          mkdir -p animation-fallback dist
          git archive --format=tar origin/output | tar -xf - -C animation-fallback

      - name: Generate contribution snake
        id: snake
        continue-on-error: true
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Validate contribution snake
        id: snake_validation
        if: steps.snake.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: test -s dist/github-contribution-grid-snake.svg && test -s dist/github-contribution-grid-snake-dark.svg

      - name: Restore contribution snake fallback
        if: always() && (steps.snake.outcome != 'success' || steps.snake_validation.outcome != 'success')
        shell: bash
        run: cp animation-fallback/github-contribution-grid-snake*.svg dist/

      - name: Generate contribution arcade games
        id: arcade
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman,breakout,galaga,bomberman,puzzle-bobble,minesweeper

      - name: Validate contribution arcade games
        id: arcade_validation
        if: steps.arcade.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for game in pacman breakout galaga bomberman puzzle-bobble minesweeper
          do
            test -s "dist/${game}-contribution-graph.svg"
            test -s "dist/${game}-contribution-graph-dark.svg"
          done

      - name: Restore contribution arcade fallback
        if: always() && (steps.arcade.outcome != 'success' || steps.arcade_validation.outcome != 'success')
        shell: bash
        run: |
          rm -f dist/*-contribution-graph*.svg
          cp animation-fallback/*-contribution-graph*.svg dist/

      - name: Publish animations to output branch
        id: publish
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          author: Ahmad Mujtaba <72138709+pypi-ahmad@users.noreply.github.com>
          committer: Ahmad Mujtaba <72138709+pypi-ahmad@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report generator failures
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          test "${{ steps.snake.outcome }}" = success
          test "${{ steps.snake_validation.outcome }}" = success
          test "${{ steps.arcade.outcome }}" = success
          test "${{ steps.arcade_validation.outcome }}" = success

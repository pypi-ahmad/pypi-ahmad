name: Update Profile Animations

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: false

jobs:
  generate-profile-animations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save current animations as fallbacks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin output
          mkdir -p animation-fallback dist
          for file in \
            github-contribution-grid-snake.svg \
            github-contribution-grid-snake-dark.svg \
            pacman-contribution-graph.svg \
            pacman-contribution-graph-dark.svg
          do
            git show "origin/output:${file}" > "animation-fallback/${file}"
          done

      - name: Generate contribution snake
        id: snake
        continue-on-error: true
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Validate contribution snake
        id: snake_validation
        if: steps.snake.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: test -s dist/github-contribution-grid-snake.svg && test -s dist/github-contribution-grid-snake-dark.svg

      - name: Restore contribution snake fallback
        if: always() && (steps.snake.outcome != 'success' || steps.snake_validation.outcome != 'success')
        shell: bash
        run: cp animation-fallback/github-contribution-grid-snake*.svg dist/

      - name: Generate Pac-Man contribution graph
        id: pacman
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Validate Pac-Man contribution graph
        id: pacman_validation
        if: steps.pacman.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: test -s dist/pacman-contribution-graph.svg && test -s dist/pacman-contribution-graph-dark.svg

      - name: Restore Pac-Man fallback
        if: always() && (steps.pacman.outcome != 'success' || steps.pacman_validation.outcome != 'success')
        shell: bash
        run: cp animation-fallback/pacman-contribution-graph*.svg dist/

      - name: Publish animations to output branch
        id: publish
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report generator failures
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          test "${{ steps.snake.outcome }}" = success
          test "${{ steps.snake_validation.outcome }}" = success
          test "${{ steps.pacman.outcome }}" = success
          test "${{ steps.pacman_validation.outcome }}" = success

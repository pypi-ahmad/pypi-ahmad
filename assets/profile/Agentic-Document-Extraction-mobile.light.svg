<svg xmlns="http://www.w3.org/2000/svg" width="360" height="392" viewBox="0 0 360 392" role="img" aria-labelledby="title desc"><title id="title">Paperplane</title><desc id="desc">Parse documents into grounded Markdown, JSON, and review artifacts. Flow: Document to OCR to Extraction to Evaluation.</desc><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#F2EFE8"/><stop offset="1" stop-color="#FFFEFA"/></linearGradient><pattern id="rules" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H32" stroke="#D2CEC5" opacity=".22"/></pattern></defs><rect x=".75" y=".75" width="358.5" height="390.5" rx="8" fill="url(#surface)" stroke="#D2CEC5" stroke-width="1.5"/><rect x="1" y="1" width="358" height="390" rx="8" fill="url(#rules)"/><path d="M16 18v184" stroke="#B4232F" stroke-width="3"/><text x="28" y="34" fill="#66635E" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1">01 / DOCUMENT AI</text><text x="28" y="65" fill="#171719" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Paperplane</text><text x="28" y="108" fill="#3F3E42" font-family="Segoe UI,Arial,sans-serif" font-size="14">Parse documents into grounded</text><text x="28" y="129" fill="#3F3E42" font-family="Segoe UI,Arial,sans-serif" font-size="14">Markdown, JSON, and review artifacts.</text><text x="28" y="210" fill="#B4232F" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700">OPEN REPOSITORY ↗</text><path d="M20 230h320" stroke="#D2CEC5"/><text x="28" y="252" fill="#66635E" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1">ARCHITECTURE FLOW</text><rect x="28" y="267" width="140" height="40" rx="4" fill="#FFFEFA" stroke="#D2CEC5"/><text x="98" y="292" text-anchor="middle" fill="#3F3E42" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11">Document</text><rect x="192" y="267
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc"><title id="title">Paperplane</title><desc id="desc">Parse documents into grounded Markdown, JSON, and review artifacts. Flow: Document to OCR to Extraction to Evaluation.</desc><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0C0C0D"/><stop offset="1" stop-color="#151517"/></linearGradient><pattern id="rules" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H32" stroke="#343438" opacity=".22"/></pattern></defs><rect x=".75" y=".75" width="958.5" height="178.5" rx="8" fill="url(#surface)" stroke="#343438" stroke-width="1.5"/><rect x="1" y="1" width="958" height="178" rx="8" fill="url(#rules)"/><path d="M210 20v140M660 20v140" stroke="#343438"/><path d="M18 20v140" stroke="#FF5A5F" stroke-width="3"/><text x="32" y="48" fill="#96928A" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.2">01 / DOCUMENT AI</text><text x="32" y="82" fill="#F4F1EA" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Paperplane</text><text x="32" y="144" fill="#FF5A5F" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700">OPEN REPOSITORY ↗</text><text x="238" y="55" fill="#96928A" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.1">PROJECT / SYSTEM</text><text x="238" y="100" fill="#C9C5BD" font-family="Segoe UI,Arial,sans-serif" font-size="16">Parse documents into grounded Markdown, JSON,</text><text x="238" y="124" fill="#C9C5BD" font-family="Segoe UI,Arial,sans-serif" font-size="16">and review artifacts.</text><text x="690" y="31" fill="#96928A" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1">ARCHITECTURE FLOW</text><path d="M798 67h22M744 84v32M798 133h22" fill="none" stroke="#F
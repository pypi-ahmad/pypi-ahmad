<svg xmlns="http://www.w3.org/2000/svg" width="360" height="208" viewBox="0 0 360 208" role="img" aria-labelledby="title desc"><title id="title">LoRA Fine-tune Studio</title><desc id="desc">Prepare datasets, train local adapters, and compare them with base models. Flow: Dataset to Prepare to Train to Compare.</desc><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0C0C0D"/><stop offset="1" stop-color="#151517"/></linearGradient><pattern id="rules" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H32" stroke="#343438" opacity=".22"/></pattern></defs><rect x=".75" y=".75" width="358.5" height="206.5" rx="8" fill="url(#surface)" stroke="#343438" stroke-width="1.5"/><rect x="1" y="1" width="358" height="206" rx="8" fill="url(#rules)"/><path d="M12 14v132" stroke="#FF5A5F" stroke-width="3"/><text x="22" y="26" fill="#96928A" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1">02 / MODEL TRAINING</text><text x="22" y="52" fill="#F4F1EA" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">LoRA Fine-tune Studio</text><text x="22" y="78" fill="#C9C5BD" font-family="Segoe UI,Arial,sans-serif" font-size="14">Prepare datasets, train local adapters, and</text><text x="22" y="97" fill="#C9C5BD" font-family="Segoe UI,Arial,sans-serif" font-size="14">compare them with base models.</text><text x="22" y="140" fill="#FF5A5F" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11" font-weight="700">OPEN REPOSITORY ↗</text><path d="M20 154h320" stroke="#343438"/><text x="22" y="172" fill="#96928A" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1">ARCHITECTURE FLOW</text><text x="22" y="192" fill="#C9C5BD" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11"><tspan>Dataset</tspan><tspan fill="#FF5A5F"> → </tspan><tspan>Prepare</tspan><tspan fill="#FF5A5F"> → </tspan><tspan>Train</tspan><tspan fill="#FF5A5F"> → </tspan><tspan>Compare</tspan></text></svg>

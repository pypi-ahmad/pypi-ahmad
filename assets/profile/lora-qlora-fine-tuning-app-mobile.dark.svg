<svg xmlns="http://www.w3.org/2000/svg" width="360" height="392" viewBox="0 0 360 392" role="img" aria-labelledby="title desc"><title id="title">LoRA Fine-tune Studio</title><desc id="desc">Prepare datasets, train local adapters, and compare them with base models. Flow: Dataset to Prepare to Train to Compare.</desc><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0C0C0D"/><stop offset="1" stop-color="#151517"/></linearGradient><pattern id="rules" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H32" stroke="#343438" opacity=".22"/></pattern></defs><rect x=".75" y=".75" width="358.5" height="390.5" rx="8" fill="url(#surface)" stroke="#343438" stroke-width="1.5"/><rect x="1" y="1" width="358" height="390" rx="8" fill="url(#rules)"/><path d="M16 18v184" stroke="#FF5A5F" stroke-width="3"/><text x="28" y="34" fill="#96928A" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1">02 / MODEL TRAINING</text><text x="28" y="65" fill="#F4F1EA" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">LoRA Fine-tune Studio</text><text x="28" y="108" fill="#C9C5BD" font-family="Segoe UI,Arial,sans-serif" font-size="14">Prepare datasets, train local</text><text x="28" y="129" fill="#C9C5BD" font-family="Segoe UI,Arial,sans-serif" font-size="14">adapters, and compare them with base</text><text x="28" y="150" fill="#C9C5BD" font-family="Segoe UI,Arial,sans-serif" font-size="14">models.</text><text x="28" y="210" fill="#FF5A5F" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700">OPEN REPOSITORY ↗</text><path d="M20 230h320" stroke="#343438"/><text x="28" y="252" fill="#96928A" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1">ARCHITECTURE FLOW</text><rect x="28" y="267" width="140" height="40" rx="4" fill="#151517" stroke="#343438"/><text x="98" y="292" text-anchor="mid
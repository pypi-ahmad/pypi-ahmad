<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160" role="img" aria-labelledby="title desc"><title id="title">LoRA Fine-tune Studio</title><desc id="desc">Prepare datasets, train local adapters, and compare them with base models. Flow: Dataset to Prepare to Train to Compare.</desc><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#F2EFE8"/><stop offset="1" stop-color="#FFFEFA"/></linearGradient><pattern id="rules" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H32" stroke="#D2CEC5" opacity=".22"/></pattern></defs><rect x=".75" y=".75" width="598.5" height="158.5" rx="8" fill="url(#surface)" stroke="#D2CEC5" stroke-width="1.5"/><rect x="1" y="1" width="598" height="158" rx="8" fill="url(#rules)"/><path d="M12 14v86" stroke="#B4232F" stroke-width="3"/><text x="22" y="24" fill="#66635E" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1">02 / MODEL TRAINING</text><text x="578" y="24" text-anchor="end" fill="#B4232F" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11" font-weight="700">OPEN REPOSITORY ↗</text><text x="22" y="51" fill="#171719" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">LoRA Fine-tune Studio</text><text x="22" y="77" fill="#3F3E42" font-family="Segoe UI,Arial,sans-serif" font-size="16">Prepare datasets, train local adapters, and compare them with</text><text x="22" y="97" fill="#3F3E42" font-family="Segoe UI,Arial,sans-serif" font-size="16">base models.</text><path d="M20 110h560" stroke="#D2CEC5"/><text x="22" y="128" fill="#66635E" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1">ARCHITECTURE FLOW</text><text x="22" y="147" fill="#3F3E42" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="13"><tspan>Dataset</tspan><tspan fill="#B4232F"> → </tspan><tspan>Prepare</tspan><tspan fill="#B
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="72" viewBox="0 0 960 72" role="img" aria-labelledby="title desc">
  <title id="title">Background terminal divider</title>
  <desc id="desc">A Windows Terminal section divider showing a PowerShell command for this section.</desc>
  <defs>
    <linearGradient id="surface" x2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F0FF"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#625B78" opacity=".12"/></pattern>
  </defs>
  <rect x=".75" y=".75" width="958.5" height="70.5" rx="14" fill="url(#surface)" stroke="#DDD6F0" stroke-width="1.5"/>
  <path d="M1 34h958" stroke="#DDD6F0"/>
  <path d="M14 34V10q0-5 5-5h158q5 0 5 5v24" fill="#FFFFFF" stroke="#DDD6F0"/>
  <path d="m29 15 8 6-8 6m12 0h9" fill="none" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="61" y="24" fill="#48435F" font-family="Segoe UI,Arial,sans-serif" font-size="11">PowerShell</text>
  <text x="198" y="24" fill="#625B78" font-family="Segoe UI,Arial,sans-serif" font-size="16">+</text>
  <g fill="none" stroke="#625B78" stroke-width="1.3"><path d="M860 18h12M898 14h10v9h-10zM934 14l9 9m0-9-9 9"/></g>
  <rect x="12" y="38" width="936" height="24" rx="7" fill="url(#grid)"/>
  <text x="24" y="55" font-family="Cascadia Code,Consolas,monospace" font-size="11.5"><tspan fill="#6D28D9">PS C:\Users\Ahmad\profile&gt; </tspan><tspan fill="#0E7490">Get-Content .\about.json</tspan></text>
  <text x="928" y="55" text-anchor="end" fill="#625B78" font-family="Cascadia Code,Consolas,monospace" font-size="9" font-weight="700" letter-spacing="1.2">BACKGROUND</text>
</svg>

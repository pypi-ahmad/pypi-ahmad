<svg xmlns="http://www.w3.org/2000/svg" width="960" height="72" viewBox="0 0 960 72" role="img" aria-labelledby="title desc">
  <title id="title">Activity terminal divider</title>
  <desc id="desc">A Windows Terminal section divider showing a PowerShell command for this section.</desc>
  <defs>
    <linearGradient id="surface" x2="1"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#19172D"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8A8BF" opacity=".12"/></pattern>
  </defs>
  <rect x=".75" y=".75" width="958.5" height="70.5" rx="14" fill="url(#surface)" stroke="#39364F" stroke-width="1.5"/>
  <path d="M1 34h958" stroke="#39364F"/>
  <path d="M14 34V10q0-5 5-5h158q5 0 5 5v24" fill="#0D1117" stroke="#39364F"/>
  <path d="m29 15 8 6-8 6m12 0h9" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="61" y="24" fill="#C5C5D8" font-family="Segoe UI,Arial,sans-serif" font-size="11">PowerShell</text>
  <text x="198" y="24" fill="#A8A8BF" font-family="Segoe UI,Arial,sans-serif" font-size="16">+</text>
  <g fill="none" stroke="#A8A8BF" stroke-width="1.3"><path d="M860 18h12M898 14h10v9h-10zM934 14l9 9m0-9-9 9"/></g>
  <rect x="12" y="38" width="936" height="24" rx="7" fill="url(#grid)"/>
  <text x="24" y="55" font-family="Cascadia Code,Consolas,monospace" font-size="11.5"><tspan fill="#A78BFA">PS C:\Users\Ahmad\profile&gt; </tspan><tspan fill="#67E8F9">git log --graph --oneline</tspan></text>
  <text x="928" y="55" text-anchor="end" fill="#A8A8BF" font-family="Cascadia Code,Consolas,monospace" font-size="9" font-weight="700" letter-spacing="1.2">ACTIVITY</text>
</svg>

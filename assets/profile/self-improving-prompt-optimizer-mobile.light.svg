<svg xmlns="http://www.w3.org/2000/svg" width="360" height="208" viewBox="0 0 360 208" role="img" aria-labelledby="title desc"><title id="title">Prompt optimizer</title><desc id="desc">Compare prompt candidates against a fixed benchmark with visible trade-offs. Flow: Prompt to Generate to Evaluate to Select.</desc><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#F2EFE8"/><stop offset="1" stop-color="#FFFEFA"/></linearGradient><pattern id="rules" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H32" stroke="#D2CEC5" opacity=".22"/></pattern></defs><rect x=".75" y=".75" width="358.5" height="206.5" rx="8" fill="url(#surface)" stroke="#D2CEC5" stroke-width="1.5"/><rect x="1" y="1" width="358" height="206" rx="8" fill="url(#rules)"/><path d="M12 14v132" stroke="#B4232F" stroke-width="3"/><text x="22" y="26" fill="#66635E" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1">03 / EVALUATION</text><text x="22" y="52" fill="#171719" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Prompt optimizer</text><text x="22" y="78" fill="#3F3E42" font-family="Segoe UI,Arial,sans-serif" font-size="14">Compare prompt candidates against a fixed</text><text x="22" y="97" fill="#3F3E42" font-family="Segoe UI,Arial,sans-serif" font-size="14">benchmark with visible trade-offs.</text><text x="22" y="140" fill="#B4232F" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11" font-weight="700">OPEN REPOSITORY ↗</text><path d="M20 154h320" stroke="#D2CEC5"/><text x="22" y="172" fill="#66635E" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1">ARCHITECTURE FLOW</text><text x="22" y="192" fill="#3F3E42" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11"><tspan>Prompt</tspan><tspan fill="#B4232F"> → </tspan><tspan>Generate</tspan><tspan fill="#B4232F"> → </tspan><tspan>Evaluate</tspan><tspan fill="#B4232F"> → </tspan><tspan>Select</tspan></text></svg>

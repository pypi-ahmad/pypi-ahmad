<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc"><title id="title">Video Summarizer</title><desc id="desc">Reuse video evidence for retrieval, answers, and generated documents. Flow: Video to Evidence to Retrieval to Answer.</desc><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#F2EFE8"/><stop offset="1" stop-color="#FFFEFA"/></linearGradient><pattern id="rules" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 31.5H32" stroke="#D2CEC5" opacity=".22"/></pattern></defs><rect x=".75" y=".75" width="958.5" height="178.5" rx="8" fill="url(#surface)" stroke="#D2CEC5" stroke-width="1.5"/><rect x="1" y="1" width="958" height="178" rx="8" fill="url(#rules)"/><path d="M210 20v140M660 20v140" stroke="#D2CEC5"/><path d="M18 20v140" stroke="#B4232F" stroke-width="3"/><text x="32" y="48" fill="#66635E" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.2">04 / MULTIMODAL</text><text x="32" y="82" fill="#171719" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Video</text><text x="32" y="108" fill="#171719" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Summarizer</text><text x="32" y="144" fill="#B4232F" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700">OPEN REPOSITORY ↗</text><text x="238" y="55" fill="#66635E" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.1">PROJECT / SYSTEM</text><text x="238" y="100" fill="#3F3E42" font-family="Segoe UI,Arial,sans-serif" font-size="16">Reuse video evidence for retrieval, answers, and</text><text x="238" y="124" fill="#3F3E42" font-family="Segoe UI,Arial,sans-serif" font-size="16">generated documents.</text><text x="690" y="31" fill="#66635E" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1">ARCHITECTURE FLOW</text><path d="M798 67h22M744 84v32M798 133h22" fill="none" stroke="#B4232F" stroke-width="1.5"/><rect x="690" y="50" width="108" height="34" rx="3" fill="#FFFEFA" stroke="#D2CEC5"/><text x="744" y="72" text-anchor="middle" fill="#3F3E42" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="10">Video</text><rect x="820" y="50" width="108" height="34" rx="3" fill="#FFFEFA" stroke="#D2CEC5"/><text x="874" y="72" text-anchor="middle" fill="#3F3E42" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="10">Evidence</text><rect x="690" y="116" width="108" height="34" rx="3" fill="#FFFEFA" stroke="#D2CEC5"/><text x="744" y="138" text-anchor="middle" fill="#3F3E42" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="10">Retrieval</text><rect x="820" y="116" width="108" height="34" rx="3" fill="#FFFEFA" stroke="#D2CEC5"/><text x="874" y="138" text-anchor="middle" fill="#3F3E42" font-family="Cascadia Code,Cascadia Mono,Consolas,monospace" font-size="10">Answer</text></svg>

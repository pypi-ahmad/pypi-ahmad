<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">Ahmad's AI workshop</title>
  <desc id="description">An illustrated workspace: document pages, retrieval nodes, a model chip, and review tools connected by colored paths. A visual metaphor for separate AI projects.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#19172D"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#67E8F9"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FCD34D"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8A8BF" opacity=".16"/></pattern>
    <style>
      .flow { animation: flow 12s linear infinite; }
      .paper { animation: float 12s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -800; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .flow,.paper { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="258" rx="24" fill="url(#surface)" stroke="#39364F"/>
  <rect x="14" y="14" width="932" height="232" rx="16" fill="url(#grid)"/>
  <ellipse cx="479" cy="139" rx="160" ry="104" fill="#A78BFA" opacity=".045"/>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2" font-weight="600">
